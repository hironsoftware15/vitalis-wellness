name: Build Android App Bundle (Google Play Release)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release AAB & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Release App Bundle (.aab)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: aegis-wellness-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release APK (For Direct Device Testing)
        uses: actions/upload-artifact@v4
        with:
          name: aegis-wellness-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
