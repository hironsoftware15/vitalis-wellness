name: Deploy Vitalis to App Store Connect

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Upload iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Run Fastlane Deployment
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        run: |
          gem install bundler && bundle install || gem install fastlane
          fastlane release
