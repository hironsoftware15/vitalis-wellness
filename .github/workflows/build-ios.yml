name: Build Apple iOS App (Vitalis HealthKit)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build & Validate iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Default Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer || true
          xcodebuild -version

      - name: Build Vitalis iOS App (Simulator / Generic Device)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project Vitalis.xcodeproj \
            -scheme Vitalis \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || xcodebuild clean build -project Vitalis.xcodeproj -scheme Vitalis -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO

      - name: Archive Vitalis Release (Mock / Ad-Hoc Build)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Vitalis.xcodeproj \
            -scheme Vitalis \
            -archivePath build/Vitalis.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            || true

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitalis-ios-archive
          path: ios/build/*.xcarchive
          if-no-files-found: ignore
